[package]
name = "rust-simple-access-control"
version = "0.1.0"
authors = ["Peter Salomonsen <contact@petersalomonsen.com>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.29.0", default-features = false, features = ["legacy"] }
borsh = { version = "1.0", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "5.29.0", default-features = false, features = ["legacy", "unit-testing"] }
near-workspaces = "0.23.0"
tokio = { version = "1.10.0", features = ["full"] }
anyhow = "1.0"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
