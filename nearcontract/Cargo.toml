[package]
name = "rust-simple-access-control"
version = "0.1.0"
authors = ["Peter Salomonsen <contact@petersalomonsen.com>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
byteorder= "1.4.2"
near-sdk = { version = "5.6.0", features = ["legacy"] }
ed25519-dalek = "1.0.1"
borsh = { version = "1.0", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "5.6.0", features = ["legacy", "unit-testing"] }
near-workspaces = "0.22.1"
tokio = { version = "1.10.0", features = ["full"] }
anyhow = "1.0"
near-units = "0.2.0"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
